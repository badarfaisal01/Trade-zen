<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 44" width="175" height="44" fill="none">
  <defs>
    <linearGradient id="quotexGradientBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="40%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Rounded Square Green-Blue Gradient Badge -->
  <rect x="0" y="2" width="40" height="40" rx="12" fill="url(#quotexGradientBadge)"/>
  <!-- Lowercase "qu" centered inside badge -->
  <text x="20" y="28.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">qu</text>
  
  <!-- "Quotex" text mark -->
  <text x="52" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.8">Quotex</text>
</svg>
